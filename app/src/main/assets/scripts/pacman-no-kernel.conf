# Appended to the guest rootfs's /etc/pacman.conf.
#
# Under proot there is no real kernel inside the guest — every process shares
# the host Android kernel. Kernel packages and kernel-module tooling cannot
# do anything there except waste bandwidth, fail on module (re)builds, or
# (if they ever did succeed) be actively harmful by touching paths proot
# shouldn't own. Per the task requirement, both are blocked outright so
# pacman silently skips them on any upgrade/install instead of erroring out
# or trying to update a kernel that is never actually used.

IgnorePkg = linux linux-aarch64 linux-armv7 linux-api-headers linux-firmware
IgnorePkg = linux-headers linux-aarch64-headers linux-armv7-headers
IgnorePkg = mkinitcpio mkinitcpio-busybox
IgnoreGroup = base-devel-kernel kernel-modules
NoExtract  = usr/lib/modules/*
